# Render Blueprint - Perfect Car Picker, both services on the free plan.
# Replaces: EC2 t3.micro + nginx + Let's Encrypt (frontend) and the
# Lambda container + API Gateway (backend). Render terminates TLS and
# serves perfectcarpicker.jonahrosenberg.work.
services:
  - type: web
    name: perfectcarpicker
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    envVars:
      - key: APP_PORT             # frontend Dockerfile starts streamlit on $APP_PORT
        value: "10000"            # Render's expected default port
      - key: API_URL              # backend service URL + /calculate
        sync: false

  - type: web
    name: perfectcarpicker-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: cardb
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: GEMINI_API_KEY
        sync: false
